name: release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump + CHANGELOG. Merging that PR cuts a
# *draft* GitHub Release for vX.Y.Z; `artifacts` then attaches the binaries, the
# OS packages, an SBOM and a signed provenance attestation, and publishes the
# draft last.
#
# Why this is two release-please jobs and not one — do not collapse them back:
# a draft release has no git tag, publishing it is what creates the tag. A
# single invocation cuts the release and then computes the next release PR in
# the same run, while the release is still a draft — so there is no tag for the
# version already in .release-please-manifest.json, release-please loses its
# anchor, walks the entire history and opens a PR re-releasing everything.
# Merging that cuts another release, which opens another PR, forever. So:
#
#   release-please  phase 1 — cut the draft release only
#   artifacts       attach assets, publish the draft -> tag exists
#   release-pr      phase 2 — open/update the next release PR only

on:
  push:
    branches: [main]

# Two pushes landing seconds apart start two release-pr jobs, and both update
# refs/heads/release-please--branches--main — the loser dies on "Error updating
# ref". Queue them rather than cancelling: a release interrupted half-way is
# worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags & releases
      pull-requests: write # open/update the release PR
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          # "simple" is language-agnostic (tracks version.txt + CHANGELOG).
          # Manifest mode: release-please-config.json sets `draft: true` so the
          # GitHub Release is created unpublished. Immutable releases reject asset
          # uploads once a release is published, so assets must land while it is
          # still a draft; a later step flips it to published.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # Binaries, the deb/rpm/apk/Arch packages, one SBOM per archive and a cosign
  # signature over the checksums — all of it from .goreleaser.yaml, so that
  # `goreleaser release --snapshot` on a laptop produces the same set.
  artifacts:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the release
      id-token: write # keyless signing via Sigstore
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The release is still a draft here, so its tag ref does not exist
          # yet. This push *is* the release commit, so check that out instead.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      # `--skip=publish` because the draft release already exists and this job
      # only attaches to it; `--skip=validate` because the tag it is building
      # does not exist until the draft is published, and GORELEASER_CURRENT_TAG
      # is what supplies the version in the meantime.
      - name: build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: v2.16.0
          args: release --clean --skip=publish,announce,validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.release-please.outputs.tag }}

      # Keyless Sigstore signing — no long-lived key to store or rotate. Verify
      # with: gh attestation verify <file> --repo <owner>/<repo>
      - name: sign
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst

      # Only the artifacts: dist/ also holds goreleaser's own metadata.json,
      # config.yaml and one directory per build target, none of which belong on
      # a release.
      - name: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          find dist -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.apk' -o -name '*.pkg.tar.zst' \
               -o -name 'checksums.txt*' -o -name '*.sbom.json' \) \
            -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Publish the draft release
        # Assets can only be attached while the release is a draft;
        # publishing last is what leaves it immutable with assets intact.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # Phase 2 — open/update the next release PR, now that `artifacts` has
  # published the draft and the tag exists. `always()` because on an ordinary
  # push no release was cut and `artifacts` is skipped, yet the release PR still
  # has to be kept up to date; when a release *was* cut, `artifacts` must have
  # succeeded, or there is no tag to anchor on and this would re-release the
  # whole history.
  release-pr:
    needs: [release-please, artifacts]
    if: always()
      && needs.release-please.result == 'success'
      && (needs.release-please.outputs.released != 'true'
      || needs.artifacts.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # open/update the release PR
    steps:
      # Same configuration as phase 1 — the two invocations must agree.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # A release PR opened with GITHUB_TOKEN is authored by
          # `github-actions[bot]`, which is not a repo collaborator: every
          # `pull_request` workflow on that branch lands in `action_required`
          # and waits for a human click, so the release PR never shows a CI
          # result until someone approves 7 runs by hand. A PAT with
          # contents+pull-requests write makes the PR author an identity with
          # write access, and the checks just run. Falls back to GITHUB_TOKEN
          # so a repo without the secret keeps today's behaviour.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
