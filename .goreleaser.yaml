# GoReleaser builds the cross-platform binaries, the OS packages (deb, rpm, apk,
# Arch) and an SBOM per archive, and keyless-signs the checksums file with
# cosign using the GitHub Actions OIDC token — no long-lived keys.
#
# The release is created as a DRAFT: immutable releases reject asset uploads
# once a release is published, so every asset must land while it is still a
# draft. The workflow publishes it last. See .github/workflows/release.yml.
version: 2

project_name: azkaban

before:
  hooks:
    - go mod tidy

builds:
  - id: azkaban
    main: .
    binary: azkaban
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: azkaban
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - src: man/*.1
        dst: man

# The OS packages. One binary, one man page, the licence and the readme — laid
# out where a packager expects them rather than in a tarball to unpack.
nfpms:
  - id: azkaban
    package_name: azkaban
    vendor: Fabio Cicerchia
    homepage: https://github.com/fabiocicerchia/azkaban
    maintainer: Fabio Cicerchia <info@fabiocicerchia.it>
    description: A jail for AI CLIs
    license: Apache-2.0
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    section: utils
    dependencies:
      - bubblewrap
    contents:
      - src: man/azkaban.1
        dst: /usr/share/man/man1/azkaban.1
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/azkaban/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/azkaban/README.md
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

# One SBOM (SPDX JSON) per release archive.
sboms:
  - artifacts: archive

# Keyless cosign signature over checksums.txt — verifying the checksum then
# verifies every artifact it lists. cosign v3 emits a Sigstore bundle, which
# carries the signature and the signing certificate in a single file; the old
# --output-signature/--output-certificate pair is ignored under that format.
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: fabiocicerchia
    name: azkaban
  # Created unpublished so the workflow can attach assets to it; the workflow
  # flips it to published as its last step.
  draft: true
  prerelease: auto
  footer: |
    ## Verify the download

    ```sh
    cosign verify-blob \
      --bundle checksums.txt.bundle \
      --certificate-identity-regexp 'https://github.com/fabiocicerchia/azkaban' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    sha256sum --ignore-missing -c checksums.txt
    ```
