version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck      # FC-GO-009
    - errorlint         # FC-GO-005 - catches == on errors and missing %w
    - godox             # FC-GEN-010 - no TODO/FIXME/HACK markers
    - forbidigo         # FC-GEN-055 - blocks time.Now, os.Getenv outside the root
    - noctx             # FC-GEN-032
    - nilerr
    - errname
    - exhaustive
    - gocritic
    - revive
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true         # FC-GO-007 - a discarded error must be explicit
    exhaustive:
      default-signifies-exhaustive: true
    godox:
      keywords: [TODO, FIXME, HACK, XXX]
    forbidigo:
      forbid:
        - pattern: ^time\.Now$
          msg: "FC-GEN-055: inject a clock."
        - pattern: ^os\.Getenv$
          msg: "FC-GEN-055: read env once at startup into validated config."
    revive:
      rules:
        - name: exported        # FC-GEN-008
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: package-comments

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - forbidigo      # tests may freeze the clock directly
      - path: (^|/)(main|cmd)/
        linters:
          - forbidigo      # composition root reads env and the clock

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - azkaban   # FC-GO-001 - set per repo
